[project]
name = "euaiguard"
version = "0.1.0"

dependencies = [
    "typer"
    "fastapi",
    "uvicorn",
]

[project.scripts]
euaiguard = "euaiguard.cli:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]